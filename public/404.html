<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dehydration Lab — SPA Fallback</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <script>
      (function() {
        // Базовый путь из сборки Vite: замените при необходимости
        var base = (function(){
          // Для project pages: https://<user>.github.io/<repo>/...
          if (location.hostname.endsWith('github.io')) {
            var parts = location.pathname.split('/').filter(Boolean);
            // Первый сегмент — это <repo>
            if (parts.length >= 1) return '/' + parts[0] + '/';
          }
          // Иначе: корень
          return '/';
        })();
        var path = location.pathname.replace(base,'');
        var redirect = base + '#/'+ path + location.search + location.hash;
        // Перенаправляем на index.html SPA, сохраняя путь в hash
        location.replace(redirect);
      })();
    </script>
  </body>
</html>
